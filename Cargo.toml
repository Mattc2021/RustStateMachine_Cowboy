[workspace]
resolver = "2"
members = [
    "crates/sam-protocol",
    "crates/sam-transport",
    "crates/sam-client",
    "crates/sam-core",
    "apps/sam",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
postcard = { version = "1", features = ["alloc"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
